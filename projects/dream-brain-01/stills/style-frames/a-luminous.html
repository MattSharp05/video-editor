<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>.cap{color:#eaf2ff;text-shadow:0 2px 18px rgba(0,0,0,.8)} .cap em{font-style:normal;color:#ffc46b}
.tagline{position:absolute;left:70px;top:72px;font:800 30px Hanken;letter-spacing:4px;color:#7d8bb8}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body><div class="stage" id="st"></div>
<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
const beat = new URLSearchParams(location.search).get('beat') || '1';
const W=1080,H=1920;
const st=document.getElementById('st');
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setSize(W,H); renderer.setPixelRatio(1);
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.0;
renderer.shadowMap.enabled=true;
st.appendChild(renderer.domElement);
const scene=new THREE.Scene();
let rs=7; const rnd=()=>((rs=(rs*16807)%2147483647)/2147483647);
const cam=new THREE.PerspectiveCamera(38,W/H,0.05,200);

// Brain shell: a deformed ellipsoid with fold-like noise, as a soft emissive point cloud + translucent surface.
function brainGeo(){
  const g=new THREE.SphereGeometry(1,160,120); const p=g.attributes.position; const v=new THREE.Vector3();
  for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i);
    let x=v.x*1.25, y=v.y*0.95, z=v.z*1.0;
    if(y<0) y*=0.8; // flatter base
    const fold=0.045*Math.sin(9*v.x+3*Math.sin(7*v.y))*Math.sin(8*v.y+4*v.z)+0.03*Math.sin(17*v.z+11*v.x);
    const gap=Math.exp(-Math.pow(v.z/0.07,2))*0.10*Math.max(0,v.y+0.2); // midline fissure
    const s=1+fold-gap; p.setXYZ(i,x*s,y*s,z*s);}
  g.computeVertexNormals(); return g;}

function glowSprite(color,size,op=1){
  const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');
  const gr=x.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.25,'rgba(255,255,255,.5)');gr.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=gr;x.fillRect(0,0,128,128);
  const m=new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),color,transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false});
  const s=new THREE.Sprite(m); s.scale.set(size,size,1); return s;}

// Neuron: soma + branching dendrites (tubes) + axon.
function branch(group,start,dir,len,rad,depth,mat){
  const pts=[start.clone()]; let p=start.clone(), d=dir.clone();
  const n=8; for(let i=0;i<n;i++){ d.add(new THREE.Vector3(rnd()-.5,rnd()-.5,rnd()-.5).multiplyScalar(.35)).normalize(); p=p.clone().addScaledVector(d,len/n); pts.push(p);}
  const curve=new THREE.CatmullRomCurve3(pts);
  const tube=new THREE.TubeGeometry(curve,40,rad,10,false);
  // taper
  const pa=tube.attributes.position; group.add(new THREE.Mesh(tube,mat));
  if(depth>0){ for(let k=0;k<2;k++){ const t=.5+rnd()*.4; const sp=curve.getPoint(t); const nd=curve.getTangent(t).add(new THREE.Vector3(rnd()-.5,rnd()-.5,rnd()-.5)).normalize(); branch(group,sp,nd,len*.6,rad*.6,depth-1,mat);} }
  return curve;}
function neuron(color,emis){
  const g=new THREE.Group();
  const mat=new THREE.MeshPhysicalMaterial({color,emissive:emis,emissiveIntensity:.35,roughness:.35,transmission:0,clearcoat:.6,clearcoatRoughness:.3});
  const soma=new THREE.Mesh(new THREE.SphereGeometry(.5,48,32),mat); soma.scale.set(1,.85,.9); g.add(soma);
  for(let i=0;i<6;i++){const a=i/6*Math.PI*2+rnd()*.4; const d=new THREE.Vector3(Math.cos(a),Math.sin(a),(rnd()-.5)*.8).normalize(); branch(g,d.clone().multiplyScalar(.4),d,2.2+rnd(),.09,2,mat);}
  g.userData.mat=mat; return g;}

if(beat==='1'){
  // The dive: side-on, a sleeping man's profile in moonlight; the brain glows through his head; a dream rises.
  scene.background=new THREE.Color('#04060d'); scene.fog=new THREE.FogExp2('#060914',0.05);
  cam.position.set(-0.6,2.4,13.5); cam.lookAt(0.2,1.6,0);
  // profile path (SVG units, upright, facing left) -> THREE.Shape (y flipped, scaled)
  const k=0.0062; const P=(x,y)=>[x*k,-y*k];
  const sh=new THREE.Shape(); sh.moveTo(...P(70,215));
  const C=(a,b,c,d,e,f)=>sh.bezierCurveTo(...P(a,b),...P(c,d),...P(e,f));
  C(150,150,175,40,165,-40); C(155,-145,75,-205,-20,-205); C(-115,-205,-168,-140,-172,-62); C(-174,-30,-186,-8,-206,24);
  C(-210,34,-200,44,-184,46); C(-182,58,-190,68,-184,78); C(-180,92,-188,104,-174,118); C(-154,148,-112,150,-84,150);
  C(-66,168,-56,192,-56,215); sh.lineTo(...P(70,215));
  const hg=new THREE.ExtrudeGeometry(sh,{depth:1.25,bevelEnabled:true,bevelThickness:.35,bevelSize:.16,bevelSegments:10,curveSegments:48}); hg.translate(0,0,-.62);
  const skin=new THREE.MeshPhysicalMaterial({color:'#9a86b0',roughness:.35,clearcoat:.8,transparent:true,opacity:.5,depthWrite:false,side:THREE.DoubleSide});
  const head=new THREE.Group(); head.position.set(0.9,0.85,0); head.rotation.z=-Math.PI/2; scene.add(head);
  head.add(new THREE.Mesh(hg,skin));
  // brain inside the skull (front toward the face = local -x)
  const brain=new THREE.Group(); brain.position.set(-.05,.52,0); brain.scale.setScalar(.66); head.add(brain);
  const bmat=new THREE.MeshPhysicalMaterial({color:'#1c2552',emissive:'#2c42b0',emissiveIntensity:.55,roughness:.35,clearcoat:1});
  const bm=new THREE.Mesh(brainGeo(),bmat); brain.add(bm);
  const back=glowSprite('#ffb547',1.5,.9); back.position.set(1.0,.05,.9); brain.add(back);
  const feel=glowSprite('#ff4d6d',.7,.85); feel.position.set(-.05,-.35,.9); brain.add(feel);
  const pl=new THREE.PointLight('#ffb547',5,2.5,1.6); pl.position.set(1.1,0,.6); brain.add(pl);
  const sp=new THREE.BufferGeometry(); const arr=[]; const pos=bm.geometry.attributes.position;
  for(let i=0;i<1100;i++){const q=Math.floor(rnd()*pos.count); arr.push(pos.getX(q)*1.01,pos.getY(q)*1.01,pos.getZ(q)*1.01);} sp.setAttribute('position',new THREE.Float32BufferAttribute(arr,3));
  brain.add(new THREE.Points(sp,new THREE.PointsMaterial({color:'#a9c6ff',size:.03,transparent:true,opacity:.8,blending:THREE.AdditiveBlending,depthWrite:false})));
  // brainstem down into the neck (toward the body)
  const stem=new THREE.Mesh(new THREE.CylinderGeometry(.09,.12,.8,24),bmat); stem.position.set(.25,-.15,0); stem.rotation.z=.25; head.add(stem);
  // pillow under the back of his head
  const pmat=new THREE.MeshStandardMaterial({color:'#28304f',roughness:.9});
  const pil=new THREE.Mesh(new THREE.SphereGeometry(1,64,32),pmat); pil.scale.set(1.7,.42,1.2); pil.position.set(0.9,-.55,0); scene.add(pil);
  // body under a blanket, stretching left
  const bs=new THREE.Shape(); bs.moveTo(-7,-.9); bs.lineTo(-.7,-.9); bs.bezierCurveTo(-.4,-.2,-.6,.35,-1.3,.55); bs.bezierCurveTo(-2.4,.85,-3.6,.6,-4.8,.5); bs.bezierCurveTo(-5.6,.42,-6.4,.3,-7,.3); bs.lineTo(-7,-.9);
  const body=new THREE.Mesh(new THREE.ExtrudeGeometry(bs,{depth:2.4,bevelEnabled:true,bevelThickness:.4,bevelSize:.3,bevelSegments:8,curveSegments:40}),new THREE.MeshStandardMaterial({color:'#2e3a6a',roughness:.8}));
  body.position.set(0,0,-1.2); scene.add(body);
  const mattress=new THREE.Mesh(new THREE.BoxGeometry(14,.5,4),new THREE.MeshStandardMaterial({color:'#151b33',roughness:1})); mattress.position.set(-2,-1.2,0); scene.add(mattress);
  // the dream rising from his forehead: a ribbon of light carrying sparks up into the dark
  const ribbonPts=[new THREE.Vector3(.75,2.0,0),new THREE.Vector3(1.2,3.0,-.3),new THREE.Vector3(.3,4.1,-.8),new THREE.Vector3(.9,5.4,-1.6)];
  const rc=new THREE.CatmullRomCurve3(ribbonPts);
  scene.add(new THREE.Mesh(new THREE.TubeGeometry(rc,80,.018,8,false),new THREE.MeshBasicMaterial({color:'#ffc46b'})));
  for(let i=0;i<46;i++){const t=rnd(); const s=glowSprite(i%3?'#ffc46b':'#9fc3ff',.06+rnd()*.2,.75); s.position.copy(rc.getPoint(t)).add(new THREE.Vector3((rnd()-.5)*.7,(rnd()-.5)*.4,(rnd()-.5)*.5)); scene.add(s);}
  // at the top: a tiny glowing dream town floating in the dark
  const town=new THREE.Group(); town.position.set(.9,5.6,-1.8); scene.add(town);
  for(let i=0;i<9;i++){const h=.25+rnd()*.45; const m=new THREE.Mesh(new THREE.BoxGeometry(.28,h,.28),new THREE.MeshStandardMaterial({color:'#1c2246',emissive:'#ffb547',emissiveIntensity:rnd()>.5?.0:0})); m.position.set((i-4)*.31,h/2,(rnd()-.5)*.5); town.add(m);
    const w=new THREE.Mesh(new THREE.PlaneGeometry(.08,.1),new THREE.MeshBasicMaterial({color:'#ffc46b'})); w.position.set(m.position.x,h*.6,m.position.z+.141); town.add(w);}
  town.add(Object.assign(glowSprite('#ffc46b',2.6,.35),{}));
  // light: cold moonlight from above-left, rim from behind
  scene.add(new THREE.AmbientLight('#1d2650',.7));
  const moon=new THREE.DirectionalLight('#9fb6ff',1.6); moon.position.set(-3,6,4); scene.add(moon);
  const rim=new THREE.DirectionalLight('#7f8cff',1.2); rim.position.set(2,3,-5); scene.add(rim);
  for(let i=0;i<260;i++){const s=glowSprite('#7d93d8',.02+rnd()*.06,.3+rnd()*.4); s.position.set((rnd()-.5)*8,rnd()*8-1,(rnd()-.5)*8); scene.add(s);}
  document.querySelector('#st').insertAdjacentHTML('beforeend','<div class="tagline">FRAME 1 · THE DIVE</div><div class="cap">Your brain doesn\'t switch off.<br><em>Parts of it get busy.</em></div>');
} else {
  // Micro: two neurons in deep fog; a gold signal reaching the gap; messenger particles crossing.
  scene.background=new THREE.Color('#04060d'); scene.fog=new THREE.FogExp2('#060a18',0.075);
  cam.position.set(0,0,9.5); cam.lookAt(0,0,0);
  scene.add(new THREE.AmbientLight('#25305a',.5));
  const key=new THREE.DirectionalLight('#8fa6ff',1.0); key.position.set(-3,5,6); scene.add(key);
  const n1=neuron('#3b4f9a','#2a3c8c'); n1.position.set(-1.6,3.2,0); scene.add(n1);
  const n2=neuron('#2d7f86','#1b6670'); n2.position.set(1.8,-3.4,-.5); scene.add(n2);
  // axon from n1 to the gap; dendrite of n2 up to the gap
  const mat1=n1.userData.mat, mat2=n2.userData.mat;
  const ax=new THREE.CatmullRomCurve3([new THREE.Vector3(-1.4,2.8,0),new THREE.Vector3(-.9,1.4,.2),new THREE.Vector3(-.4,.5,0),new THREE.Vector3(-.12,.08,0)]);
  scene.add(new THREE.Mesh(new THREE.TubeGeometry(ax,80,.14,16,false),mat1));
  const bulb=new THREE.Mesh(new THREE.SphereGeometry(.32,48,32),mat1); bulb.position.set(-.05,-.05,0); bulb.scale.set(1,.8,1); scene.add(bulb);
  const de=new THREE.CatmullRomCurve3([new THREE.Vector3(1.6,-3.0,-.4),new THREE.Vector3(1.1,-1.6,-.2),new THREE.Vector3(.6,-.7,0),new THREE.Vector3(.48,-.3,0)]);
  scene.add(new THREE.Mesh(new THREE.TubeGeometry(de,80,.16,16,false),mat2));
  const cup=new THREE.Mesh(new THREE.SphereGeometry(.36,48,32),mat2); cup.position.set(.52,-.32,0); cup.scale.set(1,.8,1); scene.add(cup);
  // the signal: bright pulse travelling down the axon
  const sig=ax.getPoint(.55); const s1=glowSprite('#ffb547',1.6,1); s1.position.copy(sig); scene.add(s1);
  const s2=glowSprite('#fff2d0',.45,1); s2.position.copy(sig); scene.add(s2);
  const pl=new THREE.PointLight('#ffb547',14,4,1.6); pl.position.copy(sig).add(new THREE.Vector3(0,0,.4)); scene.add(pl);
  for(let i=0;i<12;i++){const t=.2+i*.03; const s=glowSprite('#ffb547',.25*(i/12),.5); s.position.copy(ax.getPoint(t)); scene.add(s);} // trail
  // messenger particles crossing the gap
  for(let i=0;i<34;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.035+rnd()*.02,12,8),new THREE.MeshBasicMaterial({color:'#ffd27a'})); m.position.set(.1+rnd()*.32,-.05-rnd()*.3,(rnd()-.5)*.4); scene.add(m);}
  const gl=new THREE.PointLight('#ffc46b',3,1.5,1.5); gl.position.set(.25,-.2,.4); scene.add(gl);
  // a forest of far neurons in fog, faintly lit by tiny sparks
  for(let i=0;i<14;i++){const n=neuron('#1d2650','#141c40'); n.position.set((rnd()-.5)*14,(rnd()-.5)*22,-4-rnd()*10); n.rotation.set(rnd()*6,rnd()*6,rnd()*6); n.scale.setScalar(.7+rnd()*.6); scene.add(n);
    const sp=glowSprite(rnd()>.5?'#9fc3ff':'#ffb547',.5,.6); sp.position.copy(n.position); scene.add(sp);}
  for(let i=0;i<300;i++){const s=glowSprite('#7d93d8',.02+rnd()*.05,.4); s.position.set((rnd()-.5)*10,(rnd()-.5)*18,(rnd()-.5)*8); scene.add(s);}
  document.querySelector('#st').insertAdjacentHTML('beforeend','<div class="tagline">FRAME 2 · MICROSCOPIC</div><div class="cap">One brain cell sends a <em>spark</em><br>to the next one.</div>');
}
const comp=new EffectComposer(renderer); comp.addPass(new RenderPass(scene,cam));
comp.addPass(new UnrealBloomPass(new THREE.Vector2(W,H),.9,.6,.55)); comp.addPass(new OutputPass());
comp.render();
await document.fonts.ready; window.__ready=true;
</script></body></html>
